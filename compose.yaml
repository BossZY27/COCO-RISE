name: coco-rise

services:
  api:
    build: .
    environment:
      IRFA_LLM_BASE: http://ollama:11434
      IRFA_EMBED_MODEL: ${IRFA_EMBED_MODEL:-bge-m3:latest}
      IRFA_EXPOSE_DOCS: "on"
      IRFA_ADMIN_ENABLED: ${IRFA_ADMIN_ENABLED:-on}
      IRFA_ADMIN_TOKEN: ${IRFA_ADMIN_TOKEN:-}
      IRFA_AUDIT: ${IRFA_AUDIT:-off}
      IRFA_TRUSTED_HOSTS: localhost,127.0.0.1,api,testserver
      IRFA_SOURCE_DIR: /app/data/private
      IRFA_INGESTION_DIR: /app/data/ingestion
    ports:
      - "127.0.0.1:${IRFA_API_PORT:-8077}:8077"
    volumes:
      - rise-data:/app/data
      - ./data/private:/app/data/private:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8077/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.13.5
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  models:
    image: curlimages/curl:8.17.0
    profiles: [setup]
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        until curl -fsS http://ollama:11434/api/version; do sleep 2; done;
        curl -fS http://ollama:11434/api/pull
        -d '{"name":"${IRFA_EMBED_MODEL:-bge-m3:latest}","stream":false}'
    depends_on:
      - ollama

volumes:
  rise-data:
  ollama-models:

