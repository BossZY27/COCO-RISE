<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RISE · ฐานข้อมูล</title><style>body{font:16px system-ui;max-width:1100px;margin:auto;padding:24px;color:#20364b}input,select,button{font:inherit;padding:8px;margin:6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f2f6fa;padding:20px}</style></head><body><h1>ฐานข้อมูล RISE</h1><a href="/">แชต</a> · <a href="/admin">ตรวจทานข้อมูล</a><p>ข้อมูลจาก PostgreSQL จริง เวกเตอร์อยู่ใน ChromaDB</p><label>โทเคนผู้ดูแล <input id="token" type="password" autocomplete="off"></label><label>ตาราง <select id="table"><option>documents</option><option>document_versions</option><option>pages</option><option>chunks</option><option>knowledge_items</option><option>query_runs</option><option>ingestion_jobs</option><option>index_generations</option></select></label><button id="load">โหลดข้อมูล</button><pre id="out" role="status"></pre><script>
document.getElementById('load').onclick=async()=>{const out=document.getElementById('out');try{const response=await fetch('/api/db/overview?table='+encodeURIComponent(document.getElementById('table').value),{headers:{'X-Admin-Token':document.getElementById('token').value}});const data=await response.json();out.textContent=JSON.stringify(data,null,2);}catch(e){out.textContent='โหลดข้อมูลไม่สำเร็จ';}};
</script></body></html>
